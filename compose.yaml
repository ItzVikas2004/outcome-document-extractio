x-app: &app
  build: .
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://outcome@postgres:5432/outcome}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
    WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
    WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-5}
    WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
    WORKER_RETRY_BASE_SECONDS: ${WORKER_RETRY_BASE_SECONDS:-2}
    UPLOAD_DIR: /service/uploads
  volumes:
    - document_data:/service/uploads
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  init: true
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outcome
      POSTGRES_DB: outcome
      # Local development only; no host port is published.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcome -d outcome"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_data:
  document_data:
